name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff cffconvert
      - run: ruff check src tests scripts
      - run: cffconvert --validate -i CITATION.cff

  # The install of the README, and nothing else: numpy, scipy, matplotlib, opencv. The tests that need geopandas/osmnx skip.
  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: evacrl-casebuild --help && evacrl-experiment --help
      - run: python -W error -m unittest discover tests

  # With the casebuild extra the geospatial tests run too (osmnx, geopandas, shapely).
  test-casebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[plots,casebuild]"
      - run: python -W error -m unittest discover tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the wheel installs and runs away from the checkout
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "import evacrl; print(evacrl.__version__)"
          evacrl-casebuild --help > /dev/null
          evacrl-experiment --help > /dev/null

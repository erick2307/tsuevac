[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evacrl"
version = "0.1.0"
description = "Tsunami evacuation guidance with reinforcement learning (Q-learning, SARSA, Monte Carlo)"
readme = "README.md"
dependencies = ["numpy", "matplotlib", "opencv-python"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evacrl"
dynamic = ["version"]   # evacrl.__version__
description = "Tsunami evacuation guidance with reinforcement learning (Q-learning, SARSA, Monte Carlo)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Erick Mas" }]
keywords = ["tsunami", "evacuation", "reinforcement learning", "agent-based simulation", "disaster risk reduction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"  # tested on 3.10, 3.11, 3.12 and 3.13
# Core: the algorithms (src/evacrl), the entry points (scripts/) and the regression tests (tests/). SciPy: evacrl.casebuild (the
# clean-up of a network, the shortest paths, the validator) and the statistics of the experiment layer.
# The full opencv-python is required, not -headless: makeVideo() calls cv2.destroyAllWindows().
dependencies = ["numpy", "scipy", "matplotlib", "opencv-python"]

[project.optional-dependencies]
# evacrl.evac_plots (evacuation curves)
plots = ["pandas"]
# notebooks/
notebooks = ["scipy", "pandas", "seaborn", "geopandas", "contextily", "jupyter"]
# Building a case from raw data: cases/new_kochi pipeline, pre/, variants/app_2022/setup, datasets/gis.
# The `osgeo` module (createLinksAndNodes.py, SetDatabaseBldMeshCodes.py) comes from
# GDAL, which is best installed with conda (`conda install gdal`) rather than pip.
# osmnx < 2: the pipeline uses graph_from_bbox(north, south, east, west), save_graph_shapefile, config and
# plot_graph_folium, which osmnx 2.0 changed or removed (checked offline against osmnx 1.9.4 and 2.1.1).
# This also selects an older, compatible numpy / pandas / geopandas stack.
preprocessing = ["scipy", "pandas", "seaborn", "geopandas", "shapely", "osmnx<2", "networkx", "rasterio", "folium", "contextily"]
# evacrl.casebuild (python -m evacrl.casebuild): building a case from a road network. Its core and the commands `from-raw` and
# `validate` need only numpy and scipy; downloading a network, snapping shelters and the census need the rest. osmnx < 2 as above.
casebuild = ["scipy", "osmnx<2", "geopandas", "shapely"]

# development: lint and the checks of CITATION.cff
dev = ["ruff", "cffconvert"]

[project.urls]
Repository = "https://github.com/erick2307/tsuevac"
Changelog = "https://github.com/erick2307/tsuevac/blob/main/CHANGELOG.md"

[project.scripts]
evacrl-casebuild = "evacrl.casebuild.cli:main"
evacrl-experiment = "evacrl.experiment.cli:main"

[tool.setuptools.dynamic]
version = { attr = "evacrl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Lint: `ruff check` (pyflakes errors and syntax errors) on the maintained code. The pre-processing scripts, the 2022 variant,
# and the notebooks are not linted (see docs/repository.md).
[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["datasets", "variants", "pre", "notebooks", "cases/new_kochi", "docs/audits/*/head"]

[tool.ruff.lint]
select = ["E9", "F"]
